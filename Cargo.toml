[workspace]
resolver = "2"
members = ["crates/salt-core", "launcher", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-All-Rights-Reserved"
authors = ["saltClient contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
