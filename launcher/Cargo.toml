[package]
name = "salt-launcher"
description = "Salt Launcher — a clean, glassy Minecraft launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
salt-core = { path = "../crates/salt-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[features]
# Embeds the UI into the binary. Enabled by default so a plain
# `cargo build --release` produces a working app without the Tauri CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
