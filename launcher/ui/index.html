<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salt Launcher</title>
  <link rel="stylesheet" href="css/salt.css" />
</head>
<body>
  <!-- Plain backdrop (black by default) + optional custom image. -->
  <div id="backdrop" aria-hidden="true">
    <div id="backdrop-image"></div>
  </div>

  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- Toolbar: a floating pill like the Chlorine site header. Empty space in it drags the window. -->
  <header id="titlebar" data-tauri-drag-region>
    <div class="site-header" id="site-header" data-tauri-drag-region>
      <div class="brand" id="brand" title="Home">
        <img src="img/logo.png" alt="" class="brand-logo" />
        <span class="brand-name">Salt</span>
      </div>
      <nav class="site-nav" id="topnav" aria-label="Main"></nav>
      <div class="header-actions" data-tauri-drag-region>
        <span class="titlebar-status" id="titlebar-status"></span>
        <button class="round-btn" id="theme-toggle" aria-label="Toggle light / dark">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="round-btn" id="settings-btn" aria-label="Settings"></button>
        <button class="account-chip" id="account-chip" title="Accounts"></button>
        <div id="quick-play"></div>
      </div>
    </div>
    <div class="window-controls">
      <button class="wc" id="wc-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg></button>
      <button class="wc" id="wc-max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" /></svg></button>
      <button class="wc close" id="wc-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg></button>
    </div>
  </header>

  <div id="shell">
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="progress-dock"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="onboarding-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
