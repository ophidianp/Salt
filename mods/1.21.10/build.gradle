// Shared build for every Salt mod on a 1.21.x Minecraft. Unlike 26.x, 1.21
// is obfuscated at runtime, so the remapping flavour of Loom is used with
// Mojang's official mappings (same names as the 26.3 sources).

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Build output lives outside OneDrive (it locks files mid-sync).
def localBuildRoot = file("${System.getProperty('user.home')}/SaltLauncherBuild/mods-build/${rootProject.minecraft_version}")

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom-remap'

	layout.buildDirectory = new File(localBuildRoot, project.name)

	version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
	group = 'gg.salt'

	base {
		archivesName = project.name
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
		// Every Salt mod registers its settings with saltConfig.
		if (project.name != 'saltconfig') implementation project(path: ':saltconfig', configuration: 'namedElements')
	}

	processResources {
		def version = project.version
		inputs.property "version", version
		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = rootProject.java_release as int
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(rootProject.java_release)
		targetCompatibility = JavaVersion.toVersion(rootProject.java_release)
	}
}
