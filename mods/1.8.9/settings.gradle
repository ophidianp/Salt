pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Legacy Fabric'
			url = 'https://maven.legacyfabric.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'salt-mods-1.8.9'

// One jar per Salt mod, each named salt<MOD>. Separate code base from the
// 1.21+/26.x mods: Legacy Fabric, yarn names, Java 8, LWJGL 2.
include 'saltconfig', 'salthud', 'saltmenu', 'saltzoom', 'saltfreelook', 'salttogglesprint', 'saltfullbright'
