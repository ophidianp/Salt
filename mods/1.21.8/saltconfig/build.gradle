// saltConfig reads Cloth Config screens to show other mods' options inline.
// Compile-only (remapped from intermediary): Cloth is optional at runtime (ClothBridge only loads when it's installed).
repositories {
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

dependencies {
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		transitive = false
	}
}
